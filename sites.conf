# Dashboard kiosk rotation. The Pi checks this file every 5 minutes.
# One site per line, shown top to bottom, then it loops:
#   <duration> <url>      duration: 45s, 30m, 2h (plain number = seconds)
# Lines starting with # are ignored. Keep at least one site, or the Pi
# ignores the change and keeps showing the previous list.
#
# {NAME} is a private link stored only on the Pi (secrets.conf), so it
# never appears in this public repo. {MIXPANEL} = passcode-protected board.
30m {MIXPANEL}
30m https://google.com
2m https://bing.com
